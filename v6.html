<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07101d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>تحدّي اليمعة V6</title>
<style>
:root{--bg:#07101d;--panel:#10243f;--panel2:#132d4e;--text:#f7f9ff;--muted:#a9b7cc;--gold:#ffd166;--line:#294b70;--good:#5ddd91;--bad:#ff7070;--blue:#63a9ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -15%,#244a79 0,transparent 44%),var(--bg);color:var(--text);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.35;cursor:not-allowed}
.app{width:min(1100px,100%);margin:auto;padding:12px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 13px}.brand{font-weight:950;color:var(--gold);font-size:1.15rem}.badge{display:inline-block;background:#ffd16618;border:1px solid #ffd16655;color:var(--gold);border-radius:999px;padding:6px 10px;font-size:.76rem;font-weight:850}
.panel{background:linear-gradient(160deg,#142e4eee,#0c1b31f5);border:1px solid var(--line);border-radius:19px;padding:15px;margin-top:12px;box-shadow:0 16px 42px #0004}.hero{padding:14px 0}.hero h1{font-size:clamp(2rem,8vw,3.6rem);margin:8px 0;line-height:1.08}.hero h1 span{color:var(--gold)}.sub,.small{color:var(--muted);line-height:1.7}.small{font-size:.8rem}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field label{display:block;color:var(--muted);font-size:.84rem;margin-bottom:6px}.field input{width:100%;min-height:48px;padding:10px;border-radius:12px;border:1px solid #355a83;background:#09192d;color:#fff}.btn{border:0;border-radius:13px;min-height:46px;padding:11px 14px;font-weight:900;background:var(--gold);color:#142139}.btn.secondary{background:#17375b;color:#fff;border:1px solid #315a86}.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}.btn.good{background:var(--good);color:#092217}.btn.bad{background:var(--bad);color:#2a0808}.btn.wide{width:100%}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.games{display:grid;gap:9px}.game-card{background:#0d2038;border:1px solid #2b4b6e;border-radius:14px;padding:12px}.game-card h3{margin:0 0 5px}.game-meta{font-size:.78rem;color:var(--muted);line-height:1.6}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.step{padding:6px 9px;border:1px solid #315372;border-radius:999px;color:var(--muted);font-size:.75rem}.step.on{border-color:var(--gold);color:var(--gold);background:#ffd16612}
.category-picker{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.pick{background:#0c2038;border:1px solid #2b4b6d;color:#dbe7f7;border-radius:13px;padding:12px 8px;min-height:54px;font-weight:850}.pick.on{border-color:var(--gold);background:#3a321d;color:#fff1ba}.pick small{display:block;color:var(--muted);font-size:.65rem;margin-top:3px}
.scoreboard{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}.team{background:#0d2139;border:1px solid #2d4e70;border-radius:15px;padding:10px;min-width:0}.team.active{border-color:var(--gold);box-shadow:inset 0 0 0 1px #ffd16655}.team .score{font-size:1.65rem;color:var(--gold);font-weight:950;margin:4px 0}.team .name{font-weight:900;overflow-wrap:anywhere}.assists{display:flex;gap:5px;flex-wrap:wrap}.chip{font-size:.68rem;padding:4px 6px;border-radius:999px;border:1px solid #34587d;background:#102941}.chip.used{opacity:.25;text-decoration:line-through}
.board-wrap{overflow-x:auto}.board{display:grid;gap:7px;min-width:540px}.cat{display:grid;place-items:center;text-align:center;background:#193c65;border:1px solid #3c6791;border-radius:10px;padding:6px;font-size:.77rem;font-weight:900;min-height:68px}.tile{background:#103966;border:1px solid #3d6d9b;color:var(--gold);border-radius:10px;min-height:58px;font-weight:950;font-size:1.1rem}.tile.used{background:#091728;color:#415b75;border-color:#1c3248}
.qwrap{max-width:760px;margin:auto}.qhead{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap}.timer{font-variant-numeric:tabular-nums;font-size:1.9rem;font-weight:950;color:var(--gold);border:1px solid #ffd16666;background:#ffd16612;border-radius:14px;padding:9px 14px}.timer.danger{color:var(--bad);border-color:#ff707088;animation:pulse .7s infinite alternate}@keyframes pulse{to{transform:scale(1.04)}}.qtext{font-size:clamp(1.35rem,5vw,2rem);font-weight:950;line-height:1.65;margin:17px 0}
.media{background:#071522;border:1px solid #2a4e72;border-radius:15px;padding:13px;margin-bottom:14px;display:grid;place-items:center;overflow:hidden}.flagimg{width:min(500px,100%);max-height:280px;object-fit:contain;border-radius:9px;background:#fff}.logoimg{width:min(220px,65vw);height:180px;object-fit:contain;filter:drop-shadow(0 7px 20px #0008)}.video{width:100%;aspect-ratio:16/9;border:0;border-radius:10px}
.helpbar{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:13px}.helpbtn{border-radius:12px;min-height:48px;border:1px solid #3a5878;background:#182a42;color:#fff;font-weight:900}.steal{background:#3b1818;border:1px solid #8b3737;border-radius:12px;padding:10px;color:#ffd9d9;margin-top:8px;font-weight:850}.pitbox{background:#2d2617;border:1px solid #88713b;border-radius:12px;padding:10px;margin-top:10px}.pitchoices{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}.choice{background:#102d4e;border:1px solid #37648f;border-radius:12px;padding:11px;color:#fff;font-weight:800;text-align:center}
.result{text-align:center}.result .answer{font-size:1.6rem;color:var(--good);font-weight:950;margin:8px 0}.fact{background:#0a302a;border:1px solid #277d6d;border-radius:12px;padding:11px;color:#c8f0e6;line-height:1.7}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#06131fcc;border:1px solid #385a79;border-radius:12px;padding:10px 14px;color:#fff;z-index:20}
@media(min-width:760px){.app{padding:22px}.panel{padding:21px}.scoreboard{grid-template-columns:repeat(4,1fr)}.category-picker{grid-template-columns:repeat(4,1fr)}}
@media(max-width:580px){.grid2{grid-template-columns:1fr}.app{padding:9px}}
</style></head>
<body><main id="app" class="app"></main>
<script>
'use strict';
const BANKS=[{"id":"sports","name":"⚽ رياضة","questions":[{"id":"sports-001","level":1,"type":"direct","q":"من هو الحارس الوحيد الذي فاز بالكرة الذهبية؟","a":"ليف ياشين","fact":"ليف ياشين فاز بالكرة الذهبية سنة 1963.","options":[],"distractors":["جيانلويجي بوفون","مانويل نوير","إيكر كاسياس"],"visual":null},{"id":"sports-002","level":2,"type":"direct","q":"من أول منتخب فاز بكأس العالم مرتين متتاليتين؟","a":"إيطاليا","fact":"إيطاليا فازت بنسختي 1934 و1938.","options":[],"distractors":["البرازيل","الأوروغواي","ألمانيا"],"visual":null},{"id":"sports-003","level":3,"type":"choice","q":"أي رقم هو الرقم القياسي العالمي لسباق 100 متر للرجال؟","a":"9.58 ثانية","fact":"سجله يوسين بولت في برلين عام 2009.","options":["9.58 ثانية","9.63 ثانية","9.69 ثانية","9.72 ثانية"],"distractors":["9.63 ثانية","9.69 ثانية","9.72 ثانية"],"visual":null},{"id":"sports-004","level":4,"type":"direct","q":"من أول منتخب آسيوي وصل نصف نهائي كأس العالم للرجال؟","a":"كوريا الجنوبية","fact":"كوريا الجنوبية بلغت نصف نهائي مونديال 2002.","options":[],"distractors":["اليابان","السعودية","أستراليا"],"visual":null},{"id":"sports-005","level":5,"type":"direct","q":"من اللاعب الذي أكمل الـCalendar Grand Slam للرجال سنة 1969؟","a":"رود ليفر","fact":"رود ليفر فاز بالبطولات الأربع الكبرى في سنة واحدة عام 1969.","options":[],"distractors":["بيورن بورغ","بيت سامبراس","نوفاك ديوكوفيتش"],"visual":null}]},{"id":"anime","name":"🎌 أنمي","questions":[{"id":"anime-001","level":1,"type":"direct","q":"شنو رقم غون في امتحان الصيادين بهانتر × هانتر؟","a":"405","fact":"غون حمل الرقم 405 في امتحان الصيادين.","options":[],"distractors":["404","406","99"],"visual":null},{"id":"anime-002","level":2,"type":"direct","q":"في ناروتو، شنو الاسم الحقيقي للرابع هوكاغي؟","a":"ميناتو ناميكازي","fact":"ميناتو ناميكازي هو الهوكاغي الرابع ووالد ناروتو.","options":[],"distractors":["توبيراما سينجو","هيروزن ساروتوبي","كاكاشي هاتاكي"],"visual":null},{"id":"anime-003","level":3,"type":"choice","q":"في هانتر × هانتر، أي واحد من هذيل مو عضو أصلي في جماعة العناكب؟","a":"هيسوكا","fact":"هيسوكا انضم لاحقاً ولم يكن من الأعضاء المؤسسين.","options":["هيسوكا","فيتان","فنكس","نوبوناغا"],"distractors":["فيتان","فنكس","نوبوناغا"],"visual":null},{"id":"anime-004","level":4,"type":"direct","q":"في Fullmetal Alchemist، شنو اسم والد إدوارد وألفونس إلريك؟","a":"فان هوهنهايم","fact":"فان هوهنهايم هو والد الأخوين إلريك.","options":[],"distractors":["روي موستانغ","مايس هيوز","سكار"],"visual":null},{"id":"anime-005","level":5,"type":"direct","q":"في Attack on Titan، شنو اسم الجدار الواقع بين Maria وSina؟","a":"Rose","fact":"ترتيب الجدران من الخارج للداخل: Maria ثم Rose ثم Sina.","options":[],"distractors":["Sheena","Paradis","Liberio"],"visual":null}]},{"id":"history","name":"🏺 تاريخ","questions":[{"id":"history-001","level":1,"type":"direct","q":"في أي سنة وقعت معركة حطين؟","a":"1187م","fact":"وقعت معركة حطين سنة 1187م.","options":[],"distractors":["1099م","1258م","1291م"],"visual":null},{"id":"history-002","level":2,"type":"direct","q":"من الخليفة العباسي الذي أسس مدينة بغداد؟","a":"أبو جعفر المنصور","fact":"أسس أبو جعفر المنصور بغداد في القرن الثامن الميلادي.","options":[],"distractors":["هارون الرشيد","المأمون","المعتصم"],"visual":null},{"id":"history-003","level":3,"type":"choice","q":"أي معاهدة أنهت حالة الحرب بين ألمانيا والحلفاء بعد الحرب العالمية الأولى؟","a":"معاهدة فرساي","fact":"وقعت معاهدة فرساي سنة 1919.","options":["فرساي","وستفاليا","تيلسيت","سان ستيفانو"],"distractors":["وستفاليا","تيلسيت","سان ستيفانو"],"visual":null},{"id":"history-004","level":4,"type":"direct","q":"من كان آخر خلفاء بني أمية في دمشق؟","a":"مروان بن محمد","fact":"مروان بن محمد هو آخر الخلفاء الأمويين في دمشق.","options":[],"distractors":["الوليد بن يزيد","هشام بن عبدالملك","يزيد بن الوليد"],"visual":null},{"id":"history-005","level":5,"type":"direct","q":"شنو اسم المعركة سنة 732م التي أوقفت التوسع الأموي شمالاً في فرنسا؟","a":"بلاط الشهداء / تور","fact":"تُعرف عربياً ببلاط الشهداء وبالأوروبية بمعركة تور أو بواتييه.","options":[],"distractors":["اليرموك","نهاوند","عين جالوت"],"visual":null}]},{"id":"movies","name":"🎬 أفلام","questions":[{"id":"movies-001","level":1,"type":"direct","q":"من مخرج فيلم Parasite؟","a":"بونغ جون هو","fact":"بونغ جون هو أخرج Parasite الذي فاز بأوسكار أفضل فيلم.","options":[],"distractors":["بارك تشان ووك","كيم جي وون","لي تشانغ دونغ"],"visual":null},{"id":"movies-002","level":2,"type":"direct","q":"من الممثل الذي أدى شخصية الجوكر في The Dark Knight؟","a":"هيث ليدجر","fact":"فاز هيث ليدجر بأوسكار بعد وفاته عن الدور.","options":[],"distractors":["خواكين فينيكس","جاك نيكلسون","جاريد ليتو"],"visual":null},{"id":"movies-003","level":3,"type":"direct","q":"من مخرج الفيلم الياباني Seven Samurai؟","a":"أكيرا كوروساوا","fact":"Seven Samurai من أشهر أفلام أكيرا كوروساوا.","options":[],"distractors":["ياسوجيرو أوزو","هاياو ميازاكي","تاكيشي كيتانو"],"visual":null},{"id":"movies-004","level":4,"type":"choice","q":"أي فيلم من هذيل أقدم؟","a":"The Godfather","fact":"The Godfather صدر سنة 1972.","options":["The Godfather","Jaws","Rocky","Star Wars"],"distractors":["Jaws","Rocky","Star Wars"],"visual":null},{"id":"movies-005","level":5,"type":"direct","q":"من مخرج 2001: A Space Odyssey؟","a":"ستانلي كوبريك","fact":"أخرج ستانلي كوبريك الفيلم سنة 1968.","options":[],"distractors":["سيدني لوميت","ريدلي سكوت","فرانسيس فورد كوبولا"],"visual":null}]},{"id":"kuwait_theatre","name":"🎭 مسرحيات كويتية","questions":[{"id":"kuwait_theatre-001","level":1,"type":"direct","q":"من الفنان المرتبط بدور البطولة الأشهر في «باي باي لندن»؟","a":"عبدالحسين عبدالرضا","fact":"«باي باي لندن» من أشهر الأعمال المسرحية لعبدالحسين عبدالرضا.","options":[],"distractors":["سعد الفرج","غانم الصالح","خالد النفيسي"],"visual":null},{"id":"kuwait_theatre-002","level":2,"type":"direct","q":"أي مسرحية كويتية تناولت الغزو العراقي للكويت بسخرية سياسية واضحة؟","a":"سيف العرب","fact":"«سيف العرب» ارتبطت بمرحلة ما بعد الغزو العراقي للكويت.","options":[],"distractors":["باي باي لندن","فرسان المناخ","على هامان يا فرعون"],"visual":null},{"i const APPKEY='tahaddi-yamma-v6-db';
const app=document.getElementById('app');
let db=loadDB(), session=db.currentUser||null, screen=session?'dashboard':'login', wizard={step:1,teams:['الفريق الأول','الفريق الثاني'],selected:[]}, activeGameId=null, ticker=null;
function loadDB(){try{return JSON.parse(localStorage.getItem(APPKEY))||{profiles:{},currentUser:null}}catch(e){return {profiles:{},currentUser:null}}}
function saveDB(){localStorage.setItem(APPKEY,JSON.stringify(db))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function bank(id){return BANKS.find(b=>b.id===id)}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
function header(extra=''){return `<div class="top"><div class="brand">✦ تحدّي اليمعة V6</div><div>${extra||'<span class="badge">حسابات + حفظ الألعاب</span>'}</div></div>`}
function nowText(iso){try{return new Date(iso).toLocaleString('ar-KW')}catch(e){return iso}}
async function hashPin(s){if(!crypto?.subtle)return 'local-'+s;const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(buf)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function user(){return session?db.profiles[session]:null}
function countryName(code){try{return new Intl.DisplayNames(['ar'],{type:'region'}).of(code)}catch(e){return code}}
function questionAnswer(q){return q.type==='flag'?countryName(q.code):q.a}
function qById(id){for(const b of BANKS){const q=b.questions.find(x=>x.id===id);if(q)return {...q,catId:b.id,catName:b.name}}return null}
function render(){clearInterval(ticker);if(!session)screen='login';if(screen==='login')return login();if(screen==='dashboard')return dashboard();if(screen==='wizard')return newGameWizard();if(screen==='play')return play()}

 document.getElementById('login').onclick=async()=>{const name=document.getElementById('user').value.trim(),pin=document.getElementById('pin').value.trim();if(!name||!/^[0-9]{4}$/.test(pin)){toast('اكتب اسم ورمز 4 أرقام');return}const key=name.toLowerCase();const h=await hashPin(pin);if(db.profiles[key]){if(db.profiles[key].pinHash!==h){toast('الرمز غير صحيح');return}}else db.profiles[key]={displayName:name,pinHash:h,games:[],usedQuestionIds:{},createdAt:new Date().toISOString()};db.currentUser=key;session=key;saveDB();screen='dashboard';render()};
}

function exportBackup(){
 const payload={
   app:'tahaddi-yamma',
   version:6,
   exportedAt:new Date().toISOString(),
   profileKey:session,
   profile:user()
 };
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');
 a.href=url;
 a.download='tahaddi-yamma-backup-'+new Date().toISOString().slice(0,10)+'.json';
 document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
 toast('تم تجهيز النسخة الاحتياطية');
}
function importBackup(file){
 if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{
   try{
     const payload=JSON.parse(String(reader.result||''));
     if(payload.app!=='tahaddi-yamma'||!payload.profile||!payload.profileKey)throw new Error('bad');
     if(!confirm('استرجاع النسخة راح يستبدل بيانات هذا الحساب بالنسخة المختارة. متأكد؟'))return;
     db.profiles[payload.profileKey]=payload.profile;
     db.currentUser=payload.profileKey;
     session=payload.profileKey;
     saveDB();
     toast('تم استرجاع النسخة');
     screen='dashboard';
     render();
   }catch(e){toast('ملف النسخة الاحتياطية غير صالح')}
 };
 reader.readAsText(file);
}

function pickFive(catId){
 const b=bank(catId),u=user();u.usedQuestionIds=u.usedQuestionIds||{};let used=new Set(u.usedQuestionIds[catId]||[]);
 let pool=b.questions.filter(q=>!used.has(q.id));
 if(pool.length<5){used=new Set();pool=[...b.questions];u.usedQuestionIds[catId]=[];}
 const picked=[];
 const levels=[1,2,3,4,5];
 for(const lvl of levels){const same=pool.filter(q=>q.level===lvl&&!picked.includes(q));const src=same.length?same:pool.filter(q=>!picked.includes(q));if(!src.length)break;picked.push(src[Math.floor(Math.random()*src.length)])}
 while(picked.length<Math.min(5,pool.length)){const src=pool.filter(q=>!picked.includes(q));picked.push(src[Math.floor(Math.random()*src.length)])}
 u.usedQuestionIds[catId]=[...(u.usedQuestionIds[catId]||[]),...picked.map(q=>q.id)];
 return picked.map(q=>q.id);
}
function createNewGame(){
 const u=user(),id='g'+Date.now(),questionMap={};for(const cat of wizard.selected)questionMap[cat]=pickFive(cat);
 const g={id,title:'لعبة '+(u.games.length+1),createdAt:new Date().toISOString(),teams:[...wizard.teams],selected:[...wizard.selected],questionMap,run:null};g.run=makeRun(g);u.games.push(g);saveDB();activeGameId=id;screen='play';render();
}
function makeRun(g){return {teams:g.teams.map(n=>({name:n,score:0,helps:{pit:false,bomb:false,double:false}})),used:[],turn:0,current:null,completed:false,startedAt:new Date().toISOString()}}
function activeGame(){return user().games.find(g=>g.id===activeGameId)}
function play(){
 const g=activeGame();if(!g){screen='dashboard';return render()};const r=g.run;if(r.completed)return gameEnd();if(r.current)return questionScreen(g,r);return boardScreen(g,r)
}
function scoreHTML(r){return `<div class="scoreboard">${r.teams.map((t,i)=>`<div class="team ${i===r.turn?'active':''}"><div class="name">${esc(t.name)} ${i===r.turn?'👈':''}</div><div class="score">${t.score}</div><div class="assists"><span class="chip ${t.helps.pit?'used':''}">🕳️ حفرة</span><span class="chip ${t.helps.bomb?'used':''}">💣 قنبلة</span><span class="chip ${t.helps.double?'used':''}">⚡ دبل</span></div></div>`).join('')}</div>`}
function boardScreen(g,r){
 const total=g.selected.reduce((n,c)=>n+(g.questionMap[c]?.length||0),0),done=r.used.length;let cols=g.selected.length;
 let grid=g.selected.map(id=>`<div class="cat">${bank(id).name}</div>`).join('');
 for(let row=0;row<5;row++)for(const cid of g.selected){const qid=g.questionMap[cid]?.[row],used=qid&&r.used.includes(qid),q=qid?qById(qid):null;grid+=`<button class="tile ${used?'used':''}" ${!qid||used?'disabled':''} data-q="${qid||''}">${used?'✓':q?String(q.level*100):'—'}</button>`}
 app.innerHTML=header(`<button class="btn ghost" id="home">الألعاب</button>`)+`<div class="qhead"><h2>${esc(g.title)}</h2><span class="badge">${done} / ${total}</span></div>${scoreHTML(r)}<section class="panel"><div class="qhead"><strong>الدور على: ${esc(r.teams[r.turn].name)}</strong><span class="small">اختاروا الفئة والخانة</span></div><p class="small">⏱ صاحب الدور: دقيقة و15 ثانية • الفريق الثاني: 35 ثانية • بعدها تظهر الإجابة تلقائياً.</p><div class="board-wrap"><div class="board" style="grid-template-columns:repeat(${cols},minmax(86px,1fr))">${grid}</div></div></section>`;
 document.getElementById('home').onclick=()=>{saveDB();screen='dashboard';render()};
 document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>openQuestion(g,r,b.dataset.q));
 if(done>=total){r.completed=true;saveDB();render()}
}
function openQuestion(g,r,qid){const first=r.turn,second=(r.turn+1)%r.teams.length;r.current={qid,phase:'first',firstTeam:first,secondTeam:second,team:first,end:Date.now()+75000,double:false,pitChoices:null,autoRevealed:false};saveDB();render()}
function remain(cur){return Math.max(0,Math.ceil((cur.end-Date.now())/1000))}
function mediaHTML(q){
 if(q.type==='flag')return `<div class="media"><img class="flagimg" src="https://flagcdn.com/w640/${q.code.toLowerCase()}.png" alt="علم دولة"></div>`;
 if(q.type==='logo')return `<div class="media"><img class="logoimg" src="https://cdn.simpleicons.org/${q.slug}/ffffff" alt="شعار شركة"></div>`;
 if(q.type==='video'&&q.videoId)return `<div class="media"><iframe class="video" src="https://www.youtube-nocookie.com/embed/${q.videoId}?rel=0&modestbranding=1${q.start?`&start=${q.start}`:''}" allow="accelerometer; autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>`;
 return '';
}
function questionScreen(g,r){
 const cur=r.current,q=qById(cur.qid),team=r.teams[cur.team],left=remain(cur);
 if(cur.phase==='revealed')return revealed(g,r,q);
 const phase=cur.phase==='first'?`الدور على: <strong>${esc(team.name)}</strong> — دقيقة و15 ثانية`:`🔥 فرصة الفريق الثاني: <strong>${esc(team.name)}</strong> — 35 ثانية`;
 const pit=cur.pitChoices?`<div class="pitbox"><strong>🕳️ الحفرة — 50/50</strong><div class="pitchoices">${cur.pitChoices.map(x=>`<div class="choice">${esc(x)}</div>`).join('')}</div></div>`:'';
 app.innerHTML=header()+`<section class="qwrap"><div class="panel"><div class="qhead"><div><span class="badge">${q.catName}</span> <span class="badge">${q.level*100} نقطة</span></div><div class="timer ${left<=10?'danger':''}" id="timer">⏱ <span id="sec">${left}</span></div></div><p class="${cur.phase==='second'?'steal':'sub'}">${phase}</p><div class="qtext">${esc(q.q)}</div>${mediaHTML(q)}${pit}<div class="actions"><button class="btn wide" id="reveal">👁️ إظهار الإجابة</button></div>${cur.phase==='first'?`<div class="helpbar"><button class="helpbtn" id="pit" ${team.helps.pit?'disabled':''}>🕳️ حفرة</button><button class="helpbtn" id="bomb" ${team.helps.bomb?'disabled':''}>💣 قنبلة</button><button class="helpbtn" id="double" ${team.helps.double?'disabled':''}>⚡ دبل</button></div>`:''}</div></section>`;
 document.getElementById('reveal').onclick=()=>{cur.phase='revealed';cur.autoRevealed=false;saveDB();render()};
 if(cur.phase==='first'){document.getElementById('pit').onclick=()=>usePit(r,q);document.getElementById('bomb').onclick=()=>useBomb(r);document.getElementById('double').onclick=()=>useDouble(r)}
 ticker=setInterval(()=>{if(!r.current||r.current.phase==='revealed'){clearInterval(ticker);return}const x=remain(r.current),s=document.getElementById('sec'),t=document.getElementById('timer');if(s)s.textContent=x;if(t)t.classList.toggle('danger',x<=10);if(x===0){clearInterval(ticker);timeUp(r)}},250)
}
function usePit(r,q){const cur=r.current,t=r.teams[cur.team];if(t.helps.pit)return;t.helps.pit=true;let wrong=(q.distractors||[])[0];if(!wrong)wrong='إجابة أخرى';cur.pitChoices=[questionAnswer(q),wrong].sort(()=>Math.random()-.5);saveDB();render()}
function useBomb(r){const t=r.teams[r.current.team];if(t.helps.bomb)return;t.helps.bomb=true;r.current=null;saveDB();toast('💣 رجع السؤال للخانات بدون حرقه');render()}
function useDouble(r){const cur=r.current,t=r.teams[cur.team];if(t.helps.double)return;t.helps.double=true;cur.double=true;saveDB();toast('⚡ نقاط صاحب الدور ×2 إذا احتسبتها له');render()}
function timeUp(r){const cur=r.current;if(cur.phase==='first'){cur.phase='second';cur.team=cur.secondTeam;cur.end=Date.now()+35000;saveDB();toast('⏰ انتهى وقت صاحب الدور — الحين 35 ثانية للفريق الثاني');render()}else{cur.phase='revealed';cur.autoRevealed=true;saveDB();render()}}
function revealed(g,r,q){
 const cur=r.current,first=r.teams[cur.firstTeam],second=r.teams[cur.secondTeam],p1=q.level*100*(cur.double?2:1),p2=q.level*100;
 app.innerHTML=header()+`<section class="qwrap"><div class="panel result"><div class="badge">${q.catName} • ${q.level*100} نقطة</div><h2>${cur.autoRevealed?'⏰ انتهى وقت الفريقين':'👁️ تم إظهار الإجابة'}</h2><div class="small">الإجابة الصحيحة</div><div class="answer">${esc(questionAnswer(q))}</div>${q.fact?`<div class="fact">${esc(q.fact)}</div>`:''}<h3>منو ياخذ النقاط؟</h3><div class="actions"><button class="btn good" data-award="${cur.firstTeam}">${esc(first.name)} +${p1}</button><button class="btn secondary" data-award="${cur.secondTeam}">${esc(second.name)} +${p2}</button><button class="btn ghost" id="none">بدون نقاط</button></div></div></section>`;
 document.querySelectorAll('[data-award]').forEach(b=>b.onclick=()=>finishQuestion(g,r,q,Number(b.dataset.award)));document.getElementById('none').onclick=()=>finishQuestion(g,r,q,null)
}
function finishQuestion(g,r,q,teamIndex){const cur=r.current;if(teamIndex!==null){const mult=(teamIndex===cur.firstTeam&&cur.double)?2:1;r.teams[teamIndex].score+=q.level*100*mult}if(!r.used.includes(cur.qid))r.used.push(cur.qid);r.turn=(r.turn+1)%r.teams.length;r.current=null;const total=g.selected.reduce((n,c)=>n+g.questionMap[c].length,0);if(r.used.length>=total)r.completed=true;saveDB();render()}
function gameEnd(){
 const g=activeGame(),r=g.run,order=[...r.teams].sort((a,b)=>b.score-a.score),top=order[0].score,w=order.filter(x=>x.score===top);
 app.innerHTML=header()+`<section class="panel result"><div style="font-size:3.5rem">🏆</div><h2>${w.length===1?'الفائز: '+esc(w[0].name):'تعادل: '+w.map(x=>esc(x.name)).join(' و ')}</h2>${order.map(t=>`<div class="game-card"><strong>${esc(t.name)}</strong> — ${t.score} نقطة</div>`).join('')}<div class="actions"><button class="btn" id="again">إعادة نفس اللعبة</button><button class="btn secondary" id="home">الرجوع لألعابي</button></div></section>`;
 document.getElementById('again').onclick=()=>{g.run=makeRun(g);saveDB();render()};document.getElementById('home').onclick=()=>{screen='dashboard';render()}
}
render();
</script></body></html>
