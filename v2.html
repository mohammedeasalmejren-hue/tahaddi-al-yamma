<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08111f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="تحدّي اليمعة V2">
<title>تحدّي اليمعة V2</title>
<style>
:root {
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
  color-scheme:dark; --bg:#07101d;--bg2:#0c1b31;--panel:#10233c;--panel2:#142c4b;
  --text:#f7f9ff;--muted:#a8b5ca;--gold:#ffd166;--gold2:#ffb703;--line:#294467;
  --good:#58d68d;--bad:#ff6b6b;--blue:#5aa9ff;--purple:#b58cff;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:
radial-gradient(circle at 50% -15%,#23456f 0,transparent 45%),
linear-gradient(180deg,var(--bg2),var(--bg));color:var(--text);
padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,select{font:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.35;cursor:not-allowed}
.app{width:min(1100px,100%);margin:auto;padding:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 12px}
.brand{font-weight:950;font-size:1.1rem;color:var(--gold)}
.badge{padding:6px 10px;border-radius:999px;background:#ffd16618;border:1px solid #ffd16655;color:var(--gold);font-weight:800;font-size:.78rem}
.panel{background:linear-gradient(160deg,#132a47ee,#0c1a2fee);border:1px solid var(--line);
border-radius:20px;padding:16px;box-shadow:0 15px 45px #0004;margin-top:12px}
.hero{padding:18px 0}
.hero h1{font-size:clamp(2rem,8vw,3.8rem);line-height:1.05;margin:7px 0}
.hero h1 span{color:var(--gold)}
.sub{color:var(--muted);line-height:1.8}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field label{display:block;color:var(--muted);font-size:.85rem;margin-bottom:6px}
.field input,.field select{width:100%;min-height:48px;border-radius:12px;border:1px solid #36577f;
background:#09182c;color:var(--text);padding:11px}
.btn{border:0;border-radius:13px;padding:12px 15px;min-height:47px;font-weight:900;
background:var(--gold);color:#142035}
.btn.secondary{background:#183658;color:var(--text);border:1px solid #31577f}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.good{background:var(--good);color:#082015}
.btn.bad{background:var(--bad);color:#2b0b0b}
.btn.purple{background:var(--purple);color:#180b2d}
.btn.wide{width:100%}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.scoreboard{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
.team{background:#0d2038;border:1px solid #2f5073;border-radius:16px;padding:12px;min-width:0}
.team.active{border-color:var(--gold);box-shadow:inset 0 0 0 1px #ffd16655}
.team .name{font-weight:900;overflow-wrap:anywhere}
.team .score{font-size:1.8rem;color:var(--gold);font-weight:950;margin:5px 0}
.assists{display:flex;gap:6px;flex-wrap:wrap}
.assist-chip{font-size:.72rem;padding:5px 7px;border-radius:999px;border:1px solid #355a80;background:#102842}
.assist-chip.used{opacity:.28;text-decoration:line-through}
.board-wrap{overflow-x:auto;padding-bottom:5px}
.board{display:grid;grid-template-columns:repeat(12,minmax(78px,1fr));gap:7px;min-width:980px}
.cat{min-height:74px;border-radius:11px;background:#18375c;border:1px solid #37628d;
display:grid;place-items:center;text-align:center;padding:6px;font-size:.78rem;font-weight:900}
.tile{min-height:58px;border-radius:10px;border:1px solid #3b6794;background:#123867;
color:var(--gold);font-size:1.15rem;font-weight:950}
.tile.used{background:#0a1728;color:#425a73;border-color:#1a3046}
.progress{height:7px;background:#17304f;border-radius:999px;overflow:hidden;margin:12px 0}
.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));transition:width .2s}
.qwrap{max-width:760px;margin:auto}
.qhead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;font-size:2rem;font-weight:950;color:var(--gold);
display:inline-flex;gap:8px;align-items:center;padding:10px 15px;border-radius:14px;background:#ffd16612;border:1px solid #ffd16655}
.timer.danger{color:var(--bad);border-color:#ff6b6b88;animation:pulse .75s infinite alternate}
@keyframes pulse{to{transform:scale(1.035)}}
.qtext{font-size:clamp(1.35rem,5vw,2rem);font-weight:950;line-height:1.65;margin:18px 0}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.option{background:#102b49;border:1px solid #345c84;border-radius:13px;padding:14px;color:var(--text);font-weight:850;min-height:58px}
.option.hidden-option{visibility:hidden}
.option.selected{outline:3px solid var(--gold)}
.visual{background:#071522;border:1px solid #294a6d;border-radius:16px;padding:13px;margin:8px 0 16px;display:grid;place-items:center}
.visual svg{max-width:100%;height:auto}
.answer{background:#0b342d;border:1px solid #2d8b76;border-radius:14px;padding:14px;margin-top:14px}
.answer strong{color:var(--good);font-size:1.35rem}
.fact{color:#bfe6dc;line-height:1.7;margin-top:6px}
.helpbar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.helpbtn{min-height:48px;border-radius:12px;border:1px solid #3c5270;background:#18283e;color:var(--text);font-weight:900}
.helpbtn.used{opacity:.3}
.notice{background:#1a2940;border:1px solid #3a5272;border-radius:12px;padding:11px;color:var(--muted);line-height:1.7}
.steal{background:#401b1b;border:1px solid #8a3939;border-radius:14px;padding:13px;margin-top:13px;color:#ffd6d6}
.result{text-align:center;padding:22px}
.result .cup{font-size:4rem}
.small{font-size:.78rem;color:var(--muted);line-height:1.6}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#07131fcc;
border:1px solid #355373;color:#fff;padding:10px 14px;border-radius:12px;z-index:20;backdrop-filter:blur(8px)}
@media(min-width:760px){.app{padding:24px}.panel{padding:22px}.scoreboard{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:600px){.grid2,.options{grid-template-columns:1fr}.app{padding:10px}.panel{padding:13px}}
</style>
</head>

function openQ(id){
 if(state.used.includes(id)||state.current)return;const [c,r]=id.split('-').map(Number),q=CATEGORIES[c].qs[r];
 state.current={id,c,r,phase:'main',team:state.turn,end:Date.now()+state.duration*1000,revealed:false,double:false,bombed:false};
 save();render();
}
function visualSVG(kind){
 if(kind==='pitch')return `<svg viewBox="0 0 500 260" aria-label="رسم ملعب كرة قدم"><rect x="10" y="10" width="480" height="240" rx="8" fill="#1f6b45" stroke="#fff" stroke-width="4"/><line x1="250" y1="10" x2="250" y2="250" stroke="#fff" stroke-width="3"/><circle cx="250" cy="130" r="52" fill="none" stroke="#fff" stroke-width="3"/><circle cx="250" cy="130" r="4" fill="#fff"/><rect x="10" y="72" width="70" height="116" fill="none" stroke="#fff" stroke-width="3"/><rect x="420" y="72" width="70" height="116" fill="none" stroke="#fff" stroke-width="3"/></svg>`;
 if(kind==='kuwaitFlag')return `<svg viewBox="0 0 520 300" aria-label="علم الكويت"><rect width="520" height="100" y="0" fill="#007A3D"/><rect width="520" height="100" y="100" fill="#fff"/><rect width="520" height="100" y="200" fill="#CE1126"/><polygon points="0,0 130,80 130,220 0,300" fill="#000"/></svg>`;
 return '';
}
function getQ(){const x=state.current;return CATEGORIES[x.c].qs[x.r]}
function remaining(){return Math.max(0,Math.ceil((state.current.end-Date.now())/1000))}
function question(){
 const cur=state.current,q=getQ(),team=state.teams[cur.team],left=remaining();
 const opts=q.type==='truefalse'?['صح','خطأ']:(q.options||[]);
 const optHTML=opts.length?`<div class="options" id="opts">${opts.map((o,i)=>`<button class="option" data-opt="${esc(o)}" data-idx="${i}">${esc(o)}</button>`).join('')}</div>`:'';
 const media=q.type==='image'?`<div class="visual">${visualSVG(q.visual)}</div>`:q.type==='audio'?`<div class="visual"><button class="btn secondary" id="playaudio">▶️ شغّل التلميح الصوتي</button></div>`:'';
 const phaseLabel=cur.phase==='steal'?`🔥 سرقة — ${esc(team.name)}`:`الدور على: ${esc(team.name)}`;
 app.innerHTML=header()+`<section class="qwrap"><div class="panel"><div class="qhead"><div><span class="badge">${CATEGORIES[cur.c].name}</span> <span class="badge">${q.value} نقطة</span></div><div class="timer ${left<=10?'danger':''}" id="timer">⏱ <span id="sec">${left}</span></div></div>
 <p class="sub" style="margin-top:12px">${phaseLabel}</p><div class="qtext">${esc(q.q)}</div>${media}${optHTML}
 <div id="feedback"></div>
 <div class="helpbar">${cur.phase==='main'?`<button class="helpbtn ${team.helps.pit?'used':''}" id="pit" ${team.helps.pit?'disabled':''}>🕳️ حفرة</button><button class="helpbtn ${team.helps.bomb?'used':''}" id="bomb" ${team.helps.bomb?'disabled':''}>💣 قنبلة</button><button class="helpbtn ${team.helps.double?'used':''}" id="double" ${team.helps.double?'disabled':''}>⚡ دبل</button>`:''}</div>
 <div class="actions"><button class="btn secondary" id="reveal">اكشف الإجابة</button><button class="btn ghost" id="back">رجوع بدون استخدام</button></div>
 <div id="judge"></div></div></section>`;
 if(q.type==='audio')document.getElementById('playaudio').onclick=()=>speak(q.audioText);
 document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selectedOption=b.dataset.opt});
 document.getElementById('reveal').onclick=reveal;
 document.getElementById('back').onclick=()=>{if(cur.phase==='main'){state.current=null;save();render()}else toast('أكمل فرصة السرقة أو انتهِ السؤال')};
 if(cur.phase==='main'){
   document.getElementById('pit').onclick=usePit;document.getElementById('bomb').onclick=useBomb;document.getElementById('double').onclick=useDouble;
 }
 tick=setInterval(()=>{if(!state||!state.current){clearInterval(tick);return}const r=remaining(),s=document.getElementById('sec'),t=document.getElementById('timer');if(s)s.textContent=r;if(t)t.classList.toggle('danger',r<=10);if(r===5)beep('warn');if(r===0){clearInterval(tick);timeUp()}},250);
}
function usePit(){
 const cur=state.current,q=getQ(),team=state.teams[cur.team];if(team.helps.pit)return;team.helps.pit=true;
 const opts=q.type==='truefalse'?['صح','خطأ']:(q.options||[]);
 if(opts.length>=4){const wrong=opts.map((o,i)=>({o,i})).filter(x=>x.o!==q.answer).slice(0,2);wrong.forEach(x=>{const b=document.querySelector(`[data-idx="${x.i}"]`);if(b)b.classList.add('hidden-option')});toast('الحفرة شالت خيارين غلط 🕳️')}
 else{toast('الحفرة عطتك تلميح قوي: الإجابة مو عشوائية 😄')}
 save();document.getElementById('pit').classList.add('used');document.getElementById('pit').disabled=true;
}
function useBomb(){
 const cur=state.current,team=state.teams[cur.team];if(team.helps.bomb)return;team.helps.bomb=true;
 if(!state.used.includes(cur.id))state.used.push(cur.id);state.current=null;save();beep('bad');toast('💣 انلغى السؤال — اختار خانة ثانية');setTimeout(render,350);
}
function useDouble(){
 const cur=state.current,team=state.teams[cur.team];if(team.helps.double)return;team.helps.double=true;cur.double=true;save();beep();toast('⚡ الدبل مفعّل: ربح ×2، والخطأ يخصم قيمة السؤال');document.getElementById('double').classList.add('used');document.getElementById('double').disabled=true;
}
function reveal(){
 clearInterval(tick);
 const cur=state.current,q=getQ();cur.revealed=true;save();const f=document.getElementById('feedback');
 f.innerHTML=`<div class="answer"><div class="small">الإجابة الصحيحة</div><strong>${esc(q.answer)}</strong><div class="fact">${esc(q.fact)}</div></div>`;
 const j=document.getElementById('judge');j.innerHTML=`<div class="actions"><button class="btn good" id="yes">✅ جاوب صح</button><button class="btn bad" id="no">❌ جاوب غلط</button></div>`;
 document.getElementById('yes').onclick=()=>resolve(true);document.getElementById('no').onclick=()=>resolve(false);
}
function timeUp(){
 if(!state||!state.current)return;beep('bad');toast('⏰ انتهى الوقت');
 const cur=state.current,q=getQ(),f=document.getElementById('feedback');
 if(f)f.innerHTML=`<div class="answer"><div class="small">انتهى الوقت — الإجابة الصحيحة</div><strong>${esc(q.answer)}</strong><div class="fact">${esc(q.fact)}</div></div>`;
 setTimeout(()=>{if(state&&state.current&&state.current.id===cur.id)resolve(false)},700);
}
function resolve(ok){
 const cur=state.current,q=getQ(),team=state.teams[cur.team];
 if(ok){team.score+=q.value*(cur.double?2:1);beep();finishQuestion();return}
 if(cur.phase==='main'&&cur.double)team.score-=q.value;
 if(cur.phase==='main'&&state.teams.length>1){const next=(cur.team+1)%state.teams.length;cur.phase='steal';cur.team=next;cur.double=false;cur.end=Date.now()+state.stealDuration*1000;cur.revealed=false;save();beep('warn');render();toast('🔥 فرصة سرقة!')}
 else{beep('bad');finishQuestion()}
}
function finishQuestion(){
 const cur=state.current;if(!state.used.includes(cur.id))state.used.push(cur.id);state.turn=(state.turn+1)%state.teams.length;state.current=null;save();setTimeout(render,180);
}
load();render();
if('serviceWorker' in navigator && location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
</script>
</body>
</html>
