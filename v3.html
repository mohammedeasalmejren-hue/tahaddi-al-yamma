<style>

function board(){const selected=state.selected.map(catById),max=selected.length*5,done=state.used.length,cols=selected.length;let grid=selected.map(c=>`<div class="cat">${c.name}</div>`).join('');for(let r=0;r<5;r++)for(const c of selected){const id=`${c.id}-${r}`,used=state.used.includes(id);grid+=`<button class="tile ${used?'used':''}" ${used?'disabled':''} data-id="${id}">${used?'✓':c.qs[r].v}</button>`}app.innerHTML=header()+`<div class="qhead"><h2>لوحة التحدي</h2><span class="badge">${done} / ${max}</span></div>${scores()}<section class="panel"><div class="qhead"><strong>${done===max?'خلصت الجولة':'الدور على: '+esc(state.teams[state.turn].name)}</strong><span class="small">الفريق يختار الفئة والخانة</span></div><div class="board-wrap"><div class="board" style="grid-template-columns:repeat(${cols},minmax(86px,1fr))">${grid}</div></div></section><div class="actions"><button class="btn ghost" id="reset">جولة جديدة</button></div>`;document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openQ(b.dataset.id));document.getElementById('reset').onclick=()=>{if(confirm('تبدأ جولة جديدة؟')){state=null;save();render()}}}
function openQ(id){if(state.used.includes(id))return;const k=id.lastIndexOf('-'),cid=id.slice(0,k),r=+id.slice(k+1);state.current={id,cid,r,phase:'main',team:state.turn,end:Date.now()+state.duration*1000,double:false,pitChoices:null,result:null,showAnswer:false};save();render()}function qobj(){return catById(state.current.cid).qs[state.current.r]}function remain(){return Math.max(0,Math.ceil((state.current.end-Date.now())/1000))}
function question(){const cur=state.current,q=qobj(),team=state.teams[cur.team];if(cur.phase==='result')return resultScreen();const left=remain(),cat=catById(cur.cid),options=q.t==='choice'?`<div class="options">${q.o.map(x=>`<div class="option">${esc(x)}</div>`).join('')}</div>`:'',vis=q.t==='visual'?`<div class="visual">${visual(q.visual)}</div>`:'',pit=cur.pitChoices?`<div class="pitbox"><strong>🕳️ الحفرة — 50/50</strong><div class="pitchoices">${cur.pitChoices.map(x=>`<div class="option">${esc(x)}</div>`).join('')}</div></div>`:'';app.innerHTML=header()+`<section class="qwrap"><div class="panel"><div class="qhead"><div><span class="badge">${cat.name}</span> <span class="badge">${q.v} نقطة</span></div><div class="timer ${left<=10?'danger':''}" id="timer">⏱ <span id="sec">${left}</span></div></div>${cur.phase==='steal'?`<div class="steal">🔥 فرصة سرقة لـ ${esc(team.name)} — 15 ثانية فقط</div>`:`<p class="sub">الدور على: <strong>${esc(team.name)}</strong></p>`}<div class="qtext">${esc(q.q)}</div>${vis}${options}${pit}<div class="private-answer ${cur.showAnswer?'show':''}"><strong>للحكم فقط:</strong> ${esc(q.a)}</div><div class="actions"><button class="btn secondary" id="peek">👁️ ${cur.showAnswer?'إخفاء':'عرض'} الإجابة للحكم</button><button class="btn good" id="yes">✅ صح</button><button class="btn bad" id="no">❌ خطأ</button></div>${cur.phase==='main'?`<div class="helpbar"><button class="helpbtn" id="pit" ${team.helps.pit?'disabled':''}>🕳️ حفرة</button><button class="helpbtn" id="bomb" ${team.helps.bomb?'disabled':''}>💣 قنبلة</button><button class="helpbtn" id="double" ${team.helps.double?'disabled':''}>⚡ دبل</button></div>`:''}<div class="actions"><button class="btn ghost" id="back" ${cur.phase==='steal'?'disabled':''}>رجوع للخانات</button></div></div></section>`;document.getElementById('peek').onclick=()=>{cur.showAnswer=!cur.showAnswer;save();question()};document.getElementById('yes').onclick=()=>resolve(true);document.getElementById('no').onclick=()=>resolve(false);document.getElementById('back').onclick=()=>{state.current=null;save();render()};if(cur.phase==='main'){document.getElementById('pit').onclick=usePit;document.getElementById('bomb').onclick=useBomb;document.getElementById('double').onclick=useDouble}timer=setInterval(()=>{if(!state||!state.current||state.current.phase==='result'){clearInterval(timer);return}const r=remain(),s=document.getElementById('sec'),t=document.getElementById('timer');if(s)s.textContent=r;if(t)t.classList.toggle('danger',r<=10);if(r===0){clearInterval(timer);timeUp()}},250)}
function usePit(){const cur=state.current,q=qobj(),t=state.teams[cur.team];if(t.helps.pit)return;t.helps.pit=true;const wrong=q.d[0];cur.pitChoices=Math.random()<.5?[q.a,wrong]:[wrong,q.a];save();toast('🕳️ الحفرة خلتها 50/50');question()}function useBomb(){const cur=state.current,t=state.teams[cur.team];if(t.helps.bomb)return;t.helps.bomb=true;state.current=null;save();toast('💣 رجعت السؤال للخانات — اختاروا غيره');render()}function useDouble(){const cur=state.current,t=state.teams[cur.team];if(t.helps.double)return;t.helps.double=true;cur.double=true;save();toast('⚡ الدبل: صح ×2، غلط -قيمة السؤال');question()}
function timeUp(){const cur=state.current;if(cur.phase==='main'&&state.teams.length>1){cur.phase='steal';cur.team=(cur.team+1)%state.teams.length;cur.end=Date.now()+state.stealDuration*1000;cur.showAnswer=false;save();toast('⏰ الوقت خلص — سرقة!');render()}else finish(false,'انتهى الوقت')}function resolve(ok){const cur=state.current,q=qobj(),t=state.teams[cur.team];if(ok){t.score+=q.v*(cur.double?2:1);finish(true,cur.phase==='steal'?'سرقة ناجحة':'إجابة صحيحة')}else if(cur.phase==='main'&&state.teams.length>1){if(cur.double)t.score-=q.v;cur.phase='steal';cur.team=(cur.team+1)%state.teams.length;cur.end=Date.now()+state.stealDuration*1000;cur.showAnswer=false;save();toast('🔥 فرصة سرقة');render()}else finish(false,'إجابة خاطئة')}function finish(ok,label){const cur=state.current,q=qobj();if(!state.used.includes(cur.id))state.used.push(cur.id);cur.phase='result';cur.result={ok,label,answer:q.a,fact:q.f};save();render()}function resultScreen(){const cur=state.current;app.innerHTML=header()+`<section class="qwrap"><div class="panel result"><div style="font-size:3rem">${cur.result.ok?'✅':'❌'}</div><h2>${esc(cur.result.label)}</h2><div class="small">الإجابة الصحيحة</div><div class="answer">${esc(cur.result.answer)}</div><div class="fact">${esc(cur.result.fact)}</div><div class="actions"><button class="btn wide" id="continue">الرجوع للوحة</button></div></div></section>`;document.getElementById('continue').onclick=()=>{state.turn=(state.turn+1)%state.teams.length;state.current=null;save();render()}}
load();render();</script></body></html>
